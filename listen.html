<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>들려요</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #7ee8a2;
    --danger: #f87171;
    --text: #f0f0f5;
    --muted: #6b6b80;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 상단 헤더 - 고정 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .app-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }

  .status-badge.listening {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(126, 232, 162, 0.08);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }

  .status-badge.listening .status-dot {
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* 텍스트 영역 - 스크롤 가능, flex로 남은 공간 차지 */
  .text-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 16px 20px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end; /* 새 내용이 아래쪽에 붙음 */
    gap: 8px;
    -webkit-overflow-scrolling: touch;
    min-height: 0; /* flex 자식에서 스크롤 되려면 필요 */
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }

  .placeholder-icon { font-size: 48px; opacity: 0.3; }
  .placeholder-text { font-size: 15px; line-height: 1.6; max-width: 240px; }

  /* 텍스트 블록 컨테이너 - 채팅처럼 위로 쌓임 */
  .transcripts-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .transcript-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    animation: slideUp 0.2s ease;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .transcript-text {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: -0.3px;
    word-break: keep-all;
  }

  .transcript-time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 6px;
  }

  /* 실시간 인식 중 텍스트 */
  .interim-text {
    font-size: 20px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(240, 240, 245, 0.4);
    padding: 8px 4px;
    letter-spacing: -0.3px;
    word-break: keep-all;
    min-height: 28px;
  }

  /* 하단 컨트롤 - 항상 고정 */
  .controls {
    padding: 12px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  .font-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }

  .font-label {
    font-size: 11px;
    color: var(--muted);
    width: 60px;
    text-align: center;
  }

  .font-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .font-btn:active { transform: scale(0.92); background: var(--border); }

  .btn-row { display: flex; gap: 10px; }

  .btn-clear {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear:active { transform: scale(0.97); color: var(--danger); border-color: var(--danger); }

  .btn-main {
    flex: 2;
    height: 54px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #0a0a0f;
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-main.active { background: var(--danger); color: white; }
  .btn-main:active { transform: scale(0.97); }

  .engine-badge {
    text-align: center;
    font-size: 11px;
    color: var(--muted);
  }

  .engine-badge span { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="app-name">들려요 👂</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">대기 중</span>
  </div>
</div>

<div class="text-area" id="textArea">
  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">🎙️</div>
    <div class="placeholder-text">아래 버튼을 눌러<br>음성 인식을 시작하세요</div>
  </div>
  <div class="transcripts-container" id="transcriptsContainer"></div>
  <div class="interim-text" id="interimText"></div>
</div>

<div class="controls">
  <div class="font-controls">
    <button class="font-btn" onclick="changeFontSize(-2)">A−</button>
    <div class="font-label" id="fontSizeLabel">22px</div>
    <button class="font-btn" onclick="changeFontSize(2)">A+</button>
  </div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAll()">전체 지우기</button>
    <button class="btn-main" id="mainBtn" onclick="toggleListening()">🎙️ 시작</button>
  </div>
  <div class="engine-badge">powered by <span>Google Speech-to-Text</span></div>
</div>

<script>
  // ⚠️ 여기에 본인 API 키 넣어요!
  const GOOGLE_API_KEY = 'AIzaSyC8ru6eHM9YlbIaYwWRLbgJownM334md5w';

  let isListening = false;
  let fontSize = 22;
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingInterval = null;
  let stream = null;

  const textArea = document.getElementById('textArea');
  const placeholder = document.getElementById('placeholder');
  const interimText = document.getElementById('interimText');
  const transcriptsContainer = document.getElementById('transcriptsContainer');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const mainBtn = document.getElementById('mainBtn');
  const fontSizeLabel = document.getElementById('fontSizeLabel');

  async function toggleListening() {
    if (isListening) {
      stopListening();
    } else {
      await startListening();
    }
  }

  async function startListening() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      isListening = true;
      placeholder.style.display = 'none';
      statusBadge.classList.add('listening');
      statusText.textContent = '듣는 중';
      mainBtn.textContent = '⏹ 중지';
      mainBtn.classList.add('active');

      recordChunk();
      recordingInterval = setInterval(recordChunk, 4000);
    } catch(e) {
      alert('마이크 권한을 허용해주세요!');
    }
  }

  function stopListening() {
    isListening = false;
    if (recordingInterval) clearInterval(recordingInterval);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    statusBadge.classList.remove('listening');
    statusText.textContent = '대기 중';
    mainBtn.textContent = '🎙️ 시작';
    mainBtn.classList.remove('active');
    interimText.textContent = '';
  }

  function recordChunk() {
    if (!stream || !isListening) return;
    audioChunks = [];
    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      if (audioChunks.length === 0) return;
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await sendToGoogle(blob);
    };

    mediaRecorder.start();
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, 3500);
  }

  async function sendToGoogle(blob) {
    try {
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];

        const response = await fetch(
          `https://speech.googleapis.com/v1/speech:recognize?key=${GOOGLE_API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              config: {
                encoding: 'WEBM_OPUS',
                sampleRateHertz: 48000,
                languageCode: 'ko-KR',
                enableAutomaticPunctuation: true,
                model: 'latest_long'
              },
              audio: { content: base64 }
            })
          }
        );

        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const transcript = data.results
            .map(r => r.alternatives[0].transcript)
            .join(' ');
          if (transcript.trim()) addTranscript(transcript.trim());
        }
      };
      reader.readAsDataURL(blob);
    } catch(e) {
      console.error('API 오류:', e);
    }
  }

  function addTranscript(text) {
    if (!text) return;
    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

    const block = document.createElement('div');
    block.className = 'transcript-block';
    block.innerHTML = `
      <div class="transcript-text" style="font-size:${fontSize}px">${text}</div>
      <div class="transcript-time">${timeStr}</div>
    `;

    transcriptsContainer.appendChild(block);

    // 자동 스크롤 - 항상 최신 내용이 보이도록
    textArea.scrollTop = textArea.scrollHeight;
  }

  function clearAll() {
    transcriptsContainer.innerHTML = '';
    interimText.textContent = '';
    if (!isListening) placeholder.style.display = 'flex';
  }

  function changeFontSize(delta) {
    fontSize = Math.max(16, Math.min(36, fontSize + delta));
    fontSizeLabel.textContent = fontSize + 'px';
    document.querySelectorAll('.transcript-text').forEach(el => {
      el.style.fontSize = fontSize + 'px';
    });
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
  requestWakeLock();
</script>
</body>
</html>
