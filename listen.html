<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>들려요</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');

- { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
–bg: #0a0a0f;
–border: #1e1e2e;
–accent: #7ee8a2;
–danger: #f87171;
–text: #f0f0f5;
–muted: #6b6b80;
–surface: #13131a;
}

body {
font-family: ‘Noto Sans KR’, sans-serif;
background: var(–bg);
color: var(–text);
height: 100vh;
height: 100dvh;
display: flex;
flex-direction: column;
overflow: hidden;
}

.header {
display: flex;
align-items: center;
justify-content: space-between;
padding: 16px 20px 12px;
border-bottom: 1px solid var(–border);
flex-shrink: 0;
}

.app-name {
font-size: 18px;
font-weight: 900;
letter-spacing: -0.5px;
color: var(–accent);
}

.status-badge {
display: flex;
align-items: center;
gap: 6px;
font-size: 12px;
color: var(–muted);
background: var(–surface);
padding: 5px 10px;
border-radius: 20px;
border: 1px solid var(–border);
transition: all 0.3s;
}

.status-badge.listening {
color: var(–accent);
border-color: var(–accent);
background: rgba(126, 232, 162, 0.08);
}

.status-dot {
width: 7px;
height: 7px;
border-radius: 50%;
background: var(–muted);
transition: all 0.3s;
}

.status-badge.listening .status-dot {
background: var(–accent);
animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
0%, 100% { opacity: 1; transform: scale(1); }
50% { opacity: 0.4; transform: scale(0.8); }
}

/* 텍스트 영역 - 스크롤 가능 */
.text-area {
flex: 1;
overflow-y: auto;
overflow-x: hidden;
padding: 24px 24px 16px;
display: flex;
flex-direction: column;
justify-content: flex-end;
-webkit-overflow-scrolling: touch;
min-height: 0;
}

/* 플레이스홀더 */
.placeholder {
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
flex: 1;
gap: 12px;
color: var(–muted);
text-align: center;
}

.placeholder-icon { font-size: 48px; opacity: 0.3; }
.placeholder-text { font-size: 15px; line-height: 1.6; max-width: 240px; }

/* 흘러가는 텍스트 영역 */
.live-text {
font-size: 26px;
font-weight: 400;
line-height: 1.65;
letter-spacing: -0.3px;
word-break: keep-all;
white-space: pre-wrap;
}

/* 확정된 텍스트 - 밝게 */
.confirmed {
color: var(–text);
}

/* 실시간 인식 중 텍스트 - 흐리게 */
.interim {
color: rgba(240, 240, 245, 0.4);
}

/* 하단 컨트롤 */
.controls {
padding: 12px 20px 32px;
display: flex;
flex-direction: column;
gap: 10px;
flex-shrink: 0;
border-top: 1px solid var(–border);
background: var(–bg);
}

.font-controls {
display: flex;
align-items: center;
gap: 8px;
justify-content: center;
}

.font-label {
font-size: 11px;
color: var(–muted);
width: 60px;
text-align: center;
}

.font-btn {
width: 36px;
height: 36px;
border-radius: 50%;
border: 1px solid var(–border);
background: var(–surface);
color: var(–text);
font-size: 18px;
cursor: pointer;
display: flex;
align-items: center;
justify-content: center;
transition: all 0.15s;
}

.font-btn:active { transform: scale(0.92); }

.btn-row { display: flex; gap: 10px; }

.btn-clear {
flex: 1;
height: 54px;
border-radius: 14px;
border: 1px solid var(–border);
background: var(–surface);
color: var(–muted);
font-size: 14px;
font-family: ‘Noto Sans KR’, sans-serif;
cursor: pointer;
transition: all 0.15s;
}

.btn-clear:active { color: var(–danger); border-color: var(–danger); }

.btn-main {
flex: 2;
height: 54px;
border-radius: 14px;
border: none;
background: var(–accent);
color: #0a0a0f;
font-size: 16px;
font-family: ‘Noto Sans KR’, sans-serif;
font-weight: 700;
cursor: pointer;
transition: all 0.2s;
}

.btn-main.active { background: var(–danger); color: white; }
.btn-main:active { transform: scale(0.97); }

.engine-badge {
text-align: center;
font-size: 11px;
color: var(–muted);
}

.engine-badge span { color: var(–accent); font-weight: 700; }
</style>

</head>
<body>

<div class="header">
  <div class="app-name">들려요 👂</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">대기 중</span>
  </div>
</div>

<div class="text-area" id="textArea">
  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">🎙️</div>
    <div class="placeholder-text">아래 버튼을 눌러<br>음성 인식을 시작하세요</div>
  </div>
  <!-- 확정 텍스트 -->
  <span class="live-text confirmed" id="confirmedText"></span>
  <!-- 실시간 텍스트 -->
  <span class="live-text interim" id="interimText"></span>
</div>

<div class="controls">
  <div class="font-controls">
    <button class="font-btn" onclick="changeFontSize(-2)">A−</button>
    <div class="font-label" id="fontSizeLabel">26px</div>
    <button class="font-btn" onclick="changeFontSize(2)">A+</button>
  </div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAll()">전체 지우기</button>
    <button class="btn-main" id="mainBtn" onclick="toggleListening()">🎙️ 시작</button>
  </div>
  <div class="engine-badge">실시간 <span>브라우저</span> · 정확도 <span>Google API</span></div>
</div>

<script>
  // ⚠️ 여기에 본인 API 키 넣어요!
  const GOOGLE_API_KEY = 'AIzaSyC8ru6eHM9YlbIaYwWRLbgJownM334md5w';

  const CHUNK_INTERVAL = 2000;
  const CHUNK_DURATION = 1800;

  let isListening = false;
  let fontSize = 26;

  // 브라우저 음성인식
  let recognition = null;
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  // 구글 API
  let mediaRecorder = null;
  let audioChunks = [];
  let recordingInterval = null;
  let stream = null;

  // 확정된 텍스트 누적
  let confirmedBuffer = '';
  // 구글이 교체할 마지막 청크 위치
  let lastChunkStart = 0;

  const textArea = document.getElementById('textArea');
  const placeholder = document.getElementById('placeholder');
  const confirmedText = document.getElementById('confirmedText');
  const interimText = document.getElementById('interimText');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const mainBtn = document.getElementById('mainBtn');
  const fontSizeLabel = document.getElementById('fontSizeLabel');

  function initRecognition() {
    if (!SpeechRecognition) return;
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        if (event.results[i].isFinal) {
          final += event.results[i][0].transcript;
        } else {
          interim += event.results[i][0].transcript;
        }
      }

      if (final) {
        confirmedBuffer += final;
        lastChunkStart = confirmedBuffer.length;
        confirmedText.textContent = confirmedBuffer;
      }

      interimText.textContent = interim;
      textArea.scrollTop = textArea.scrollHeight;
    };

    recognition.onend = () => {
      if (isListening) {
        try { recognition.start(); } catch(e) {}
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech' || e.error === 'aborted') return;
    };
  }

  async function toggleListening() {
    if (isListening) {
      stopListening();
    } else {
      await startListening();
    }
  }

  async function startListening() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      isListening = true;
      placeholder.style.display = 'none';
      statusBadge.classList.add('listening');
      statusText.textContent = '듣는 중';
      mainBtn.textContent = '⏹ 중지';
      mainBtn.classList.add('active');

      // 브라우저 실시간 자막
      if (SpeechRecognition) {
        initRecognition();
        try { recognition.start(); } catch(e) {}
      }

      // 구글 API
      recordChunk();
      recordingInterval = setInterval(recordChunk, CHUNK_INTERVAL);

    } catch(e) {
      alert('마이크 권한을 허용해주세요!');
    }
  }

  function stopListening() {
    isListening = false;
    if (recognition) { try { recognition.stop(); } catch(e) {} }
    if (recordingInterval) clearInterval(recordingInterval);
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    statusBadge.classList.remove('listening');
    statusText.textContent = '대기 중';
    mainBtn.textContent = '🎙️ 시작';
    mainBtn.classList.remove('active');
    interimText.textContent = '';
  }

  function recordChunk() {
    if (!stream || !isListening) return;
    audioChunks = [];

    // 구글이 교체할 시작점 기록
    const chunkStart = confirmedBuffer.length;

    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });

    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      if (audioChunks.length === 0) return;
      const blob = new Blob(audioChunks, { type: 'audio/webm' });
      await sendToGoogle(blob, chunkStart);
    };

    mediaRecorder.start();
    setTimeout(() => {
      if (mediaRecorder && mediaRecorder.state === 'recording') {
        mediaRecorder.stop();
      }
    }, CHUNK_DURATION);
  }

  async function sendToGoogle(blob, chunkStart) {
    try {
      const reader = new FileReader();
      reader.onloadend = async () => {
        const base64 = reader.result.split(',')[1];

        const response = await fetch(
          `https://speech.googleapis.com/v1/speech:recognize?key=${GOOGLE_API_KEY}`,
          {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              config: {
                encoding: 'WEBM_OPUS',
                sampleRateHertz: 48000,
                languageCode: 'ko-KR',
                enableAutomaticPunctuation: true,
                model: 'latest_short'
              },
              audio: { content: base64 }
            })
          }
        );

        const data = await response.json();

        if (data.results && data.results.length > 0) {
          const googleText = data.results
            .map(r => r.alternatives[0].transcript)
            .join(' ');

          if (googleText.trim()) {
            // 구글 텍스트로 해당 청크 부분만 교체
            confirmedBuffer = confirmedBuffer.substring(0, chunkStart) + googleText.trim() + ' ';
            confirmedText.textContent = confirmedBuffer;
            textArea.scrollTop = textArea.scrollHeight;
          }
        }
      };
      reader.readAsDataURL(blob);
    } catch(e) {
      console.error('API 오류:', e);
    }
  }

  function clearAll() {
    confirmedBuffer = '';
    lastChunkStart = 0;
    confirmedText.textContent = '';
    interimText.textContent = '';
    if (!isListening) placeholder.style.display = 'flex';
  }

  function changeFontSize(delta) {
    fontSize = Math.max(16, Math.min(40, fontSize + delta));
    fontSizeLabel.textContent = fontSize + 'px';
    confirmedText.style.fontSize = fontSize + 'px';
    interimText.style.fontSize = fontSize + 'px';
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
  requestWakeLock();
</script>

</body>
</html>
