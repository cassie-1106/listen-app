<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>들려요</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #1e1e2e;
    --accent: #7ee8a2;
    --accent2: #38bdf8;
    --danger: #f87171;
    --text: #f0f0f5;
    --muted: #6b6b80;
  }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* 상단 헤더 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }

  .app-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--accent);
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 400;
    color: var(--muted);
    background: var(--surface);
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid var(--border);
    transition: all 0.3s;
  }

  .status-badge.listening {
    color: var(--accent);
    border-color: var(--accent);
    background: rgba(126, 232, 162, 0.08);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--muted);
    transition: all 0.3s;
  }

  .status-badge.listening .status-dot {
    background: var(--accent);
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  /* 텍스트 영역 */
  .text-area {
    flex: 1;
    overflow-y: auto;
    padding: 24px 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    -webkit-overflow-scrolling: touch;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    text-align: center;
  }

  .placeholder-icon {
    font-size: 48px;
    opacity: 0.3;
  }

  .placeholder-text {
    font-size: 15px;
    line-height: 1.6;
    max-width: 240px;
  }

  .transcript-block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 16px 18px;
    animation: slideIn 0.2s ease;
  }

  .transcript-block.interim {
    border-color: rgba(126, 232, 162, 0.3);
    background: rgba(126, 232, 162, 0.05);
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .transcript-text {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    letter-spacing: -0.3px;
    word-break: keep-all;
  }

  .transcript-block.interim .transcript-text {
    color: rgba(240, 240, 245, 0.6);
  }

  .transcript-time {
    font-size: 11px;
    color: var(--muted);
    margin-top: 8px;
  }

  /* 실시간 인식 중 텍스트 */
  .interim-text {
    font-size: 22px;
    font-weight: 400;
    line-height: 1.55;
    color: rgba(240, 240, 245, 0.45);
    padding: 0 4px;
    letter-spacing: -0.3px;
    word-break: keep-all;
    min-height: 32px;
  }

  /* 하단 컨트롤 */
  .controls {
    padding: 16px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
    border-top: 1px solid var(--border);
    background: var(--bg);
  }

  /* 폰트 크기 조절 */
  .font-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }

  .font-label {
    font-size: 11px;
    color: var(--muted);
    width: 60px;
    text-align: center;
  }

  .font-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .font-btn:active { transform: scale(0.92); background: var(--border); }

  /* 버튼 영역 */
  .btn-row {
    display: flex;
    gap: 10px;
  }

  .btn-clear {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear:active { transform: scale(0.97); color: var(--danger); border-color: var(--danger); }

  .btn-main {
    flex: 2;
    height: 54px;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: #0a0a0f;
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
    letter-spacing: -0.3px;
  }

  .btn-main.active {
    background: var(--danger);
    color: white;
  }

  .btn-main:active { transform: scale(0.97); }

  /* 지원 안내 */
  .unsupported {
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
    padding: 40px 24px;
    text-align: center;
  }

  .unsupported-icon { font-size: 48px; }
  .unsupported-title { font-size: 18px; font-weight: 700; }
  .unsupported-desc { font-size: 14px; color: var(--muted); line-height: 1.7; }

  .tip-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
    color: var(--muted);
    line-height: 1.7;
    text-align: left;
    width: 100%;
  }

  .tip-box strong { color: var(--accent2); }
</style>
</head>
<body>

<div class="header">
  <div class="app-name">들려요 👂</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">대기 중</span>
  </div>
</div>

<div class="text-area" id="textArea">
  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">🎙️</div>
    <div class="placeholder-text">아래 버튼을 눌러<br>음성 인식을 시작하세요</div>
  </div>
  <div class="interim-text" id="interimText"></div>
</div>

<div class="controls">
  <div class="font-controls">
    <button class="font-btn" onclick="changeFontSize(-2)">A−</button>
    <div class="font-label" id="fontSizeLabel">22px</div>
    <button class="font-btn" onclick="changeFontSize(2)">A+</button>
  </div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAll()">전체 지우기</button>
    <button class="btn-main" id="mainBtn" onclick="toggleListening()">🎙️ 시작</button>
  </div>
</div>

<script>
  let recognition = null;
  let isListening = false;
  let fontSize = 22;
  let transcripts = [];

  const textArea = document.getElementById('textArea');
  const placeholder = document.getElementById('placeholder');
  const interimText = document.getElementById('interimText');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const mainBtn = document.getElementById('mainBtn');
  const fontSizeLabel = document.getElementById('fontSizeLabel');

  // 브라우저 지원 확인
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    document.querySelector('.controls').style.display = 'none';
    textArea.innerHTML = `
      <div class="unsupported" style="display:flex">
        <div class="unsupported-icon">⚠️</div>
        <div class="unsupported-title">이 브라우저는 지원되지 않아요</div>
        <div class="unsupported-desc">아이폰에서는 <strong>사파리(Safari)</strong>로 열어주세요.<br>크롬 앱에서는 작동하지 않을 수 있어요.</div>
        <div class="tip-box">
          <strong>열는 방법</strong><br>
          이 파일을 아이폰으로 옮긴 뒤<br>
          사파리에서 열면 바로 사용할 수 있어요.
        </div>
      </div>
    `;
  } else {
    initRecognition();
  }

  function initRecognition() {
    recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;

    recognition.onstart = () => {
      isListening = true;
      statusBadge.classList.add('listening');
      statusText.textContent = '듣는 중';
      mainBtn.textContent = '⏹ 중지';
      mainBtn.classList.add('active');
      placeholder.style.display = 'none';
    };

    recognition.onend = () => {
      if (isListening) {
        // 자동 재시작 (연속 인식)
        try { recognition.start(); } catch(e) {}
      } else {
        statusBadge.classList.remove('listening');
        statusText.textContent = '대기 중';
        mainBtn.textContent = '🎙️ 시작';
        mainBtn.classList.remove('active');
        interimText.textContent = '';
      }
    };

    recognition.onerror = (e) => {
      if (e.error === 'no-speech') return;
      if (e.error === 'aborted') return;
      isListening = false;
      statusBadge.classList.remove('listening');
      statusText.textContent = '오류';
      mainBtn.textContent = '🎙️ 시작';
      mainBtn.classList.remove('active');
    };

    recognition.onresult = (event) => {
      let interim = '';
      let final = '';

      for (let i = event.resultIndex; i < event.results.length; i++) {
        const result = event.results[i];
        if (result.isFinal) {
          final += result[0].transcript;
        } else {
          interim += result[0].transcript;
        }
      }

      // 실시간 텍스트
      interimText.textContent = interim;

      // 확정된 텍스트 블록 추가
      if (final.trim()) {
        addTranscript(final.trim());
        interimText.textContent = '';
      }
    };
  }

  function addTranscript(text) {
    if (!text) return;

    const now = new Date();
    const timeStr = now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');

    const block = document.createElement('div');
    block.className = 'transcript-block';
    block.innerHTML = `
      <div class="transcript-text" style="font-size:${fontSize}px">${text}</div>
      <div class="transcript-time">${timeStr}</div>
    `;

    // interimText 앞에 삽입
    textArea.insertBefore(block, interimText);

    // 자동 스크롤
    textArea.scrollTop = textArea.scrollHeight;

    transcripts.push({ text, time: timeStr });
  }

  function toggleListening() {
    if (!recognition) return;

    if (isListening) {
      isListening = false;
      recognition.stop();
    } else {
      isListening = true;
      try {
        recognition.start();
      } catch(e) {
        initRecognition();
        setTimeout(() => recognition.start(), 100);
      }
    }
  }

  function clearAll() {
    const blocks = textArea.querySelectorAll('.transcript-block');
    blocks.forEach(b => b.remove());
    interimText.textContent = '';
    transcripts = [];
    if (!isListening) placeholder.style.display = 'flex';
  }

  function changeFontSize(delta) {
    fontSize = Math.max(16, Math.min(36, fontSize + delta));
    fontSizeLabel.textContent = fontSize + 'px';
    document.querySelectorAll('.transcript-text').forEach(el => {
      el.style.fontSize = fontSize + 'px';
    });
  }

  // 화면 꺼짐 방지 (지원되는 경우)
  let wakeLock = null;
  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) {
        wakeLock = await navigator.wakeLock.request('screen');
      }
    } catch(e) {}
  }
  requestWakeLock();
</script>
</body>
</html>
