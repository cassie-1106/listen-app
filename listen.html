<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>헤이리슨 😎</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700;900&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    background: #0a0a0f;
    color: #f0f0f5;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px 12px;
    border-bottom: 1px solid #1e1e2e;
    flex-shrink: 0;
  }

  .app-name {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: #7ee8a2;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #6b6b80;
    background: #13131a;
    padding: 5px 10px;
    border-radius: 20px;
    border: 1px solid #1e1e2e;
    transition: all 0.3s;
  }

  .status-badge.listening {
    color: #7ee8a2;
    border-color: #7ee8a2;
    background: rgba(126, 232, 162, 0.08);
  }

  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6b6b80;
    transition: all 0.3s;
  }

  .status-badge.listening .status-dot {
    background: #7ee8a2;
    animation: pulse 1.2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .text-area {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 24px 16px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    -webkit-overflow-scrolling: touch;
    min-height: 0;
  }

  .placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
    gap: 12px;
    color: #6b6b80;
    text-align: center;
  }

  .placeholder-icon { font-size: 48px; opacity: 0.3; }
  .placeholder-text { font-size: 15px; line-height: 1.6; max-width: 240px; }

  .live-text {
    font-size: 18px;
    font-weight: 400;
    line-height: 1.65;
    letter-spacing: -0.3px;
    word-break: keep-all;
    white-space: pre-wrap;
  }

  .confirmed { color: #f0f0f5; }
  .interim { color: rgba(240, 240, 245, 0.4); }

  .controls {
    padding: 12px 20px 32px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    flex-shrink: 0;
    border-top: 1px solid #1e1e2e;
    background: #0a0a0f;
  }

  .font-controls {
    display: flex;
    align-items: center;
    gap: 8px;
    justify-content: center;
  }

  .font-label {
    font-size: 11px;
    color: #6b6b80;
    width: 60px;
    text-align: center;
  }

  .font-btn {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1px solid #1e1e2e;
    background: #13131a;
    color: #f0f0f5;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.15s;
  }

  .font-btn:active { transform: scale(0.92); background: #1e1e2e; }

  .btn-row { display: flex; gap: 10px; }

  .btn-clear {
    flex: 1;
    height: 54px;
    border-radius: 14px;
    border: 1px solid #1e1e2e;
    background: #13131a;
    color: #6b6b80;
    font-size: 14px;
    font-family: 'Noto Sans KR', sans-serif;
    cursor: pointer;
    transition: all 0.15s;
  }

  .btn-clear:active { color: #f87171; border-color: #f87171; }

  .btn-main {
    flex: 2;
    height: 54px;
    border-radius: 14px;
    border: none;
    background: #7ee8a2;
    color: #0a0a0f;
    font-size: 16px;
    font-family: 'Noto Sans KR', sans-serif;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-main.active { background: #f87171; color: white; }
  .btn-main:active { transform: scale(0.97); }

  .engine-badge {
    text-align: center;
    font-size: 11px;
    color: #6b6b80;
  }

  .engine-badge span { color: #7ee8a2; font-weight: 700; }
</style>
</head>
<body>

<div class="header">
  <div class="app-name">헤이리슨 😎</div>
  <div class="status-badge" id="statusBadge">
    <div class="status-dot"></div>
    <span id="statusText">대기 중</span>
  </div>
</div>

<div class="text-area" id="textArea">
  <div class="placeholder" id="placeholder">
    <div class="placeholder-icon">🎙️</div>
    <div class="placeholder-text">아래 버튼을 눌러<br>음성 인식을 시작하세요</div>
  </div>
  <span class="live-text confirmed" id="confirmedText"></span>
  <span class="live-text interim" id="interimText"></span>
</div>

<div class="controls">
  <div class="font-controls">
    <button class="font-btn" onclick="changeFontSize(-2)">A−</button>
    <div class="font-label" id="fontSizeLabel">18px</div>
    <button class="font-btn" onclick="changeFontSize(2)">A+</button>
  </div>
  <div class="btn-row">
    <button class="btn-clear" onclick="clearAll()">전체 지우기</button>
    <button class="btn-main" id="mainBtn" onclick="toggleListening()">🎙️ 시작</button>
  </div>
  <div class="engine-badge">실시간 <span>브라우저</span> · 정확도 <span>Google API</span></div>
</div>

<script>
  const WS_URL = 'wss://stt-server-production-58a8.up.railway.app';

  let isListening = false;
  let fontSize = 26;
  let confirmedBuffer = '';
  let ws = null;
  let mediaRecorder = null;
  let stream = null;

  const textArea = document.getElementById('textArea');
  const placeholder = document.getElementById('placeholder');
  const confirmedText = document.getElementById('confirmedText');
  const interimText = document.getElementById('interimText');
  const statusBadge = document.getElementById('statusBadge');
  const statusText = document.getElementById('statusText');
  const mainBtn = document.getElementById('mainBtn');
  const fontSizeLabel = document.getElementById('fontSizeLabel');

  function setupWebSocket() {
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      console.log('WebSocket 연결됨');
      if (!mediaRecorder || mediaRecorder.state === 'inactive') {
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
          }
        };
        mediaRecorder.start(100);
      }
    };

let interimTimer = null;

ws.onmessage = (event) => {
  const data = JSON.parse(event.data);
  if (data.type === 'final') {
    if (interimTimer) clearTimeout(interimTimer);
    confirmedBuffer += data.text + ' ';
    confirmedText.textContent = confirmedBuffer;
    interimText.textContent = '';
  } else if (data.type === 'interim') {
    interimText.textContent = data.text;
    // 2초 동안 업데이트 없으면 강제로 확정
    if (interimTimer) clearTimeout(interimTimer);
    interimTimer = setTimeout(() => {
      if (interimText.textContent) {
        confirmedBuffer += interimText.textContent + ' ';
        confirmedText.textContent = confirmedBuffer;
        interimText.textContent = '';
      }
    }, 2000);
  }
  textArea.scrollTop = textArea.scrollHeight;
};

ws.onclose = () => {
  console.log('WebSocket 끊김, 재연결 시도');
  if (isListening) {
    setTimeout(() => {
      if (isListening) {
        // mediaRecorder 재시작
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
        }
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
        mediaRecorder.ondataavailable = (e) => {
          if (e.data.size > 0 && ws && ws.readyState === WebSocket.OPEN) {
            ws.send(e.data);
          }
        };

        // WebSocket 재연결
        ws = new WebSocket(WS_URL);
        setupWebSocket();

        // WebSocket 열리면 mediaRecorder 시작
        ws.addEventListener('open', () => {
          mediaRecorder.start(100);
        });
      }
    }, 500);
  }
};
    ws.onerror = (err) => {
      console.error('WebSocket 에러:', err);
    };
  }

  async function toggleListening() {
    if (isListening) {
      stopListening();
    } else {
      await startListening();
    }
  }

  async function startListening() {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch(e) {
      alert('마이크 권한을 허용해주세요!');
      return;
    }

    isListening = true;
    placeholder.style.display = 'none';
    statusBadge.classList.add('listening');
    statusText.textContent = '듣는 중';
    mainBtn.textContent = '⏹ 중지';
    mainBtn.classList.add('active');

    ws = new WebSocket(WS_URL);
    setupWebSocket();
  }

  function stopListening() {
    isListening = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
    if (stream) stream.getTracks().forEach(t => t.stop());
    if (ws) ws.close();
    mediaRecorder = null;
    stream = null;
    ws = null;

    statusBadge.classList.remove('listening');
    statusText.textContent = '대기 중';
    mainBtn.textContent = '🎙️ 시작';
    mainBtn.classList.remove('active');
    interimText.textContent = '';
  }

  function clearAll() {
    confirmedBuffer = '';
    confirmedText.textContent = '';
    interimText.textContent = '';
    if (!isListening) placeholder.style.display = 'flex';
  }

  function changeFontSize(delta) {
    fontSize = Math.max(16, Math.min(40, fontSize + delta));
    fontSizeLabel.textContent = fontSize + 'px';
    confirmedText.style.fontSize = fontSize + 'px';
    interimText.style.fontSize = fontSize + 'px';
  }

  async function requestWakeLock() {
    try {
      if ('wakeLock' in navigator) await navigator.wakeLock.request('screen');
    } catch(e) {}
  }
  requestWakeLock();
</script>
</body>
</html>
